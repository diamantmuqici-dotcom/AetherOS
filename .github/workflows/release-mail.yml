name: Release Aether Mail
# Standalone release for the Aether Mail app. Triggered by tags like
# `mail-v1.0.0`. See RELEASING.md for the full tagging scheme.
on:
  push:
    tags: ['mail-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Aether Mail
        run: |
          chmod +x aetheros/scripts/package-app.sh
          bash aetheros/scripts/package-app.sh mail "Mail" aetheros/apps/mail
      - uses: actions/upload-artifact@v4
        with:
          name: aether-mail
          path: dist/mail/*
          if-no-files-found: error
      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/mail-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mail/*
          draft: false
          prerelease: false
          name: Aether Mail ${{ github.ref_name }}
          body: |
            Aether Mail ${{ github.ref_name }}

            End-to-end encrypted mail client (PGP) with IMAP + Proton Bridge support, no ads, no sync to third parties.

            This is a standalone bundle for GNOME/GTK4 Linux desktops. It
            ships preinstalled on [AetherOS](https://github.com/diamantmuqici-dotcom/AetherOS)
            — no separate download needed there. Verify with `sha256sum -c SHA256SUMS`.
