name: Build AetherOS ISO
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install builder
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build squashfs-tools xorriso isolinux syslinux-common genisoimage python3-pil make
          which lb
          lb --version
      - name: Sync wallpapers
        run: |
          chmod +x aetheros/scripts/*.sh
          find aetheros -type f \( -name '*.sh' -name '*.hook.chroot' -o -path '*/auto/*' \) -exec sed -i 's/\r$//' {} + || true
          make -C aetheros wallpapers
      - name: Build ISO
        working-directory: aetheros/iso
        run: |
          set +e
          set +o pipefail
          echo "## Build ISO diagnostics" >> $GITHUB_STEP_SUMMARY
          chmod +x auto/build auto/config config/hooks/live/*.hook.chroot || true
          ls -l auto/ config/hooks/live/ 2>&1 >> $GITHUB_STEP_SUMMARY
          ls -R 2>&1 >> $GITHUB_STEP_SUMMARY
          cat auto/config auto/build 2>&1 >> $GITHUB_STEP_SUMMARY
          sudo lb config --distribution bookworm --architectures amd64 --binary-images iso-hybrid --hostname aetheros-live --username aether --image-name aetheros-live --debian-installer none --archive-areas "main contrib non-free non-free-firmware" 2>&1 | tee /tmp/lb-config.log
          echo "lb-config exit: $?" >> $GITHUB_STEP_SUMMARY
          cat /tmp/lb-config.log >> $GITHUB_STEP_SUMMARY
          cat config/buildlog.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          sudo lb build 2>&1 | tee /tmp/lb-build.log
          echo "lb-build exit: $?" >> $GITHUB_STEP_SUMMARY
          cat /tmp/lb-build.log >> $GITHUB_STEP_SUMMARY
          sha256sum *.iso > *.iso.sha256 || true
          ls -lh *.iso >> $GITHUB_STEP_SUMMARY || true
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: aetheros/iso/*.iso
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/lb-config.log
