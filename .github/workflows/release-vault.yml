name: Release Aether Vault
# Standalone release for the Aether Vault app. Triggered by tags like
# `vault-v1.0.0`. See RELEASING.md for the full tagging scheme.
on:
  push:
    tags: ['vault-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Aether Vault
        run: |
          chmod +x aetheros/scripts/package-app.sh
          bash aetheros/scripts/package-app.sh vault "Vault" aetheros/apps/vault iso/config/includes.chroot/usr/share/applications/aether-vault.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: aether-vault
          path: dist/vault/*
          if-no-files-found: error
      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/vault-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vault/*
          draft: false
          prerelease: false
          name: Aether Vault ${{ github.ref_name }}
          body: |
            Aether Vault ${{ github.ref_name }}

            Local password and history vault, encrypted at rest with your passphrase.

            This is a standalone bundle for GNOME/GTK4 Linux desktops. It
            ships preinstalled on [AetherOS](https://github.com/diamantmuqici-dotcom/AetherOS)
            — no separate download needed there. Verify with `sha256sum -c SHA256SUMS`.
