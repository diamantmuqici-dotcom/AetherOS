name: Release Aether Gaming Hub
# Standalone release for the Aether Gaming Hub app. Triggered by tags like
# `gaming-hub-v1.0.0`. See RELEASING.md for the full tagging scheme.
on:
  push:
    tags: ['gaming-hub-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Aether Gaming Hub
        run: |
          chmod +x aetheros/scripts/package-app.sh
          bash aetheros/scripts/package-app.sh gaming-hub "Gaming Hub" aetheros/apps/gaming-hub iso/config/includes.chroot/usr/share/applications/org.aether.GamingHub.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: aether-gaming-hub
          path: dist/gaming-hub/*
          if-no-files-found: error
      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/gaming-hub-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gaming-hub/*
          draft: false
          prerelease: false
          name: Aether Gaming Hub ${{ github.ref_name }}
          body: |
            Aether Gaming Hub ${{ github.ref_name }}

            Game library + Game Mode controls — per-game priority, Proton-GE, controller support.

            This is a standalone bundle for GNOME/GTK4 Linux desktops. It
            ships preinstalled on [AetherOS](https://github.com/diamantmuqici-dotcom/AetherOS)
            — no separate download needed there. Verify with `sha256sum -c SHA256SUMS`.
