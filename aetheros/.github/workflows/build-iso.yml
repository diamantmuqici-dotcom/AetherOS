name: Build AetherOS ISO
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO in Debian container
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm-slim bash -c '
            set -e
            apt-get update
            apt-get install -y live-build squashfs-tools xorriso isolinux syslinux-common genisoimage python3-pil make debootstrap ca-certificates gnupg
            chmod +x aetheros/scripts/*.sh aetheros/scripts/signing/*.sh || true
            find aetheros -type f \( -name "*.sh" -o -name "*.hook.chroot" -o -path "*/auto/*" \) -exec sed -i "s/\r$//" {} + || true
            make -C aetheros wallpapers
            python3 aetheros/scripts/mk-4k.py --src aetheros/assets/wallpapers --dst aetheros/assets/wallpapers/4k || true
            cd aetheros/iso
            rm -rf auto
            chmod +x config/hooks/live/*.hook.chroot || true
            lb config --mode debian --distribution bookworm --architectures amd64 --binary-images iso-hybrid --mirror-bootstrap http://deb.debian.org/debian/ --mirror-binary http://deb.debian.org/debian/ --archive-areas "main contrib non-free non-free-firmware" 2>&1 | tee /work/aetheros/iso/lb-config.log
            lb build 2>&1 | tee /work/aetheros/iso/lb-build.log
            ISO=$(ls -1 live-image-*.iso *.iso 2>/dev/null | head -n1)
            mv "$ISO" AetherOS-live-amd64.iso || true
            sha256sum AetherOS-*.iso > *.iso.sha256
            ls -lh *.iso*
          '
      - name: Commit diagnostics
        if: always()
        run: |
          echo "diagnostics $(date -u +%FT%TZ)" >> aetheros/iso/lb-config.log
          ls -l /tmp/ >> aetheros/iso/lb-config.log 2>&1 || true
          cat aetheros/iso/lb-build.log >> aetheros/iso/lb-config.log 2>&1 || true
          ls -R aetheros/iso >> aetheros/iso/lb-config.log 2>&1 || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add aetheros/iso/lb-config.log aetheros/iso/lb-build.log || true
          git commit -m "chore: lb diagnostics [skip ci]" || true
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: aetheros/iso/*.iso*
          if-no-files-found: error
      - name: Create Release (tag)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aetheros/iso/*.iso*
          draft: false
          prerelease: false
          name: AetherOS ${{ github.ref_name }}
          body: |
            AetherOS ${{ github.ref_name }}

            Downloads below. Verify with `sha256sum -c *.iso.sha256`.

            First boot: Welcome → Choose Your Aether → Appearance → Privacy → Gaming → Enter AetherOS.
      - name: Publish latest (auto every push)
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AetherOS latest (${{ github.sha }})
          files: aetheros/iso/*.iso*
          draft: false
          prerelease: true
          body: |
            Auto-published latest build from main (${{ github.sha }}).
            Users get a notification and can choose to update or not.
            Verify with `sha256sum -c *.iso.sha256`.
          target_commitish: ${{ github.sha }}
